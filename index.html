<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f4ec">
<title>菠萝包果冻实验室</title>
<style>
:root{color-scheme:light;--paper:#f7f4ec;--ink:#393d2a;--muted:#767867;--line:#dfdfd0;--green:#555e37}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:wait}button:focus-visible,input:focus-visible{outline:3px solid #c08a32;outline-offset:5px}
.shell{max-width:1280px;margin:auto;padding:28px 48px 22px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:21px;gap:16px}.brand{display:flex;gap:11px;align-items:center;font-size:13px;font-weight:600;letter-spacing:.12em}.mark{width:27px;height:27px;border:1.5px solid var(--green);border-radius:50% 50% 40% 40%;position:relative;transform:rotate(-12deg)}.mark:after{content:"";position:absolute;inset:6px;border:1px solid var(--green);border-radius:50%}.edition{font-size:11px;letter-spacing:.14em;color:var(--muted)}
main{position:relative;text-align:center}.intro{padding-top:38px}.eyebrow{color:#8c764c;font-size:11px;letter-spacing:.25em;margin:0 0 13px}.intro h1{font-size:clamp(28px,4vw,42px);font-weight:500;letter-spacing:.09em;margin:0 0 13px}.intro p:last-child{font-size:14px;color:var(--muted);letter-spacing:.04em;margin:0}
.stage{height:clamp(280px,48vh,480px);max-width:920px;margin:3px auto 0;position:relative;isolation:isolate}.stage:before{content:"";position:absolute;inset:12% 20% 8%;border-radius:50%;background:radial-gradient(ellipse,#f0e5cb66,transparent 68%);z-index:-1}.shadow{position:absolute;width:39%;height:6%;left:30.5%;top:83%;border-radius:50%;background:#78562a2c;filter:blur(13px);z-index:-1}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas.held{cursor:grabbing}
.corner{position:absolute;top:34px;left:8px;text-align:left;font-size:10px;color:#858674;line-height:1.8;letter-spacing:.12em;pointer-events:none}.corner strong{display:block;font-weight:500;color:#62684f;font-size:12px}.status{font-size:12px;color:#6e745d;min-height:20px;margin:0 0 24px;letter-spacing:.08em}.status:before{content:"";display:inline-block;width:5px;height:5px;background:#869565;border-radius:50%;vertical-align:middle;margin-right:8px}
.controls{display:flex;justify-content:center;align-items:center;gap:28px;margin:auto;padding:22px 28px;border:1px solid var(--line);border-radius:20px;width:fit-content;background:#fffdf799;box-shadow:0 7px 30px #59523604}.actions{display:flex;gap:9px}button{border:1px solid var(--line);border-radius:11px;min-height:46px;padding:0 21px;background:transparent;color:var(--ink);font-size:13px;transition:background .15s,transform .15s}button:hover{background:#eeedde}button:active{transform:scale(.97)}button.primary{background:var(--green);border-color:var(--green);color:#fffdf4}button.primary:hover{background:#677044}.slider-box{width:218px;border-left:1px solid var(--line);padding-left:28px;text-align:left}.slider-head{display:flex;justify-content:space-between;font-size:12px;gap:10px}.slider-head output{color:#7b805e;font-size:11px}input[type=range]{width:100%;height:22px;margin:7px 0 0;accent-color:var(--green);cursor:pointer}.range-ends{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.hint{font-size:11px;color:#8b8c7b;margin:17px 0 0;letter-spacing:.05em}footer{border-top:1px solid var(--line);margin-top:32px;padding-top:17px;display:flex;justify-content:space-between;gap:12px;color:#868877;font-size:10px;letter-spacing:.12em}
@media(min-height:900px){.intro{padding-top:50px}.stage{height:490px}footer{margin-top:45px}}
@media(max-width:600px){.shell{padding:21px 20px}.brand{font-size:10px;letter-spacing:.07em}.edition{font-size:9px;letter-spacing:0}.intro{padding-top:31px}.intro h1{letter-spacing:.035em}.intro p:last-child{font-size:12px}.stage{height:340px;margin-top:8px}.corner{top:18px;left:0;font-size:8px}.corner strong{font-size:10px}.controls{flex-direction:column;width:min(100%,360px);gap:20px;padding:20px}.actions{width:100%}.actions button{flex:1;padding:0 12px}.slider-box{width:100%;border-left:0;border-top:1px solid var(--line);padding:17px 0 0}.status{margin-bottom:18px}.hint{font-size:10px}footer{font-size:9px;letter-spacing:.03em;margin-top:28px}}
@media(max-width:380px){.stage{height:285px}.edition{display:none}.intro h1{font-size:26px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand"><span class="mark" aria-hidden="true"></span>SOFT MATTER / 软物实验室</div><div class="edition">可触摸的日常 · 001</div></header>
<main>
<section class="intro"><p class="eyebrow">一只不太正经的菠萝包</p><h1>菠萝包果冻实验室</h1><p>看起来酥脆，捏起来软乎乎。</p></section>
<div class="stage" id="stage"><div class="shadow" id="shadow"></div><div class="corner"><strong>菠萝包 / 果冻态</strong>金黄酥皮 · 柔软内心</div><canvas id="jelly" role="img" aria-label="可按压、拖拽的菠萝包果冻。也可使用下方晃一下按钮体验回弹。">请使用支持 Canvas 的浏览器。</canvas></div>
<p id="status" class="status" aria-live="polite">正在准备你的菠萝包…</p>
<section class="controls" aria-label="果冻控制">
<div class="actions"><button id="shake" class="primary" disabled>↝ &nbsp; 晃一下</button><button id="reset" disabled>↺ &nbsp; 恢复原状</button></div>
<div class="slider-box"><div class="slider-head"><label for="firmness">软硬程度</label><output id="value" for="firmness">绵软 · 35%</output></div><input id="firmness" type="range" min="0" max="100" value="35"><div class="range-ends"><span>软糯糯</span><span>弹韧韧</span></div></div>
</section>
<p class="hint">按住轻压 · 拖动拉伸 · 松手回弹</p>
</main>
<footer><span>把日常揉软一点。</span><span>一张照片，一点弹性，一会儿放空。</span></footer>
</div>
<script>
'use strict';
(()=>{
const canvas=document.getElementById('jelly'),stage=document.getElementById('stage'),status=document.getElementById('status'),slider=document.getElementById('firmness'),value=document.getElementById('value');
const shake=document.getElementById('shake'),reset=document.getElementById('reset'),shadow=document.getElementById('shadow');
const N=26,M=22,nodes=[],triangles=[],reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
for(let y=0;y<=M;y++)for(let x=0;x<=N;x++)nodes.push({u:x/N,v:y/M,x:0,y:0,vx:0,vy:0});
for(let y=0;y<M;y++)for(let x=0;x<N;x++){const a=y*(N+1)+x;triangles.push(a,a+1,a+N+1,a+1,a+N+2,a+N+1)}
let texture,alpha,tw,th,renderer,ready=false,pointer=null,box={x:0,y:0,w:1,h:1},width=1,height=1,last=0,acc=0,raf=0,settled=true,steps=0,pressCount=0,gesture=0;
function say(s){if(status.textContent!==s)status.textContent=s}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function prep(img){texture=document.createElement('canvas');tw=texture.width=img.width;th=texture.height=img.height;const t=texture.getContext('2d',{willReadFrequently:true});t.drawImage(img,0,0);alpha=t.getImageData(0,0,tw,th).data;}
function makeRenderer(){
 const gl=canvas.getContext('webgl',{alpha:true,antialias:true,premultipliedAlpha:false});
 if(gl){
 function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
 const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec2 p;attribute vec2 uv;varying vec2 t;void main(){t=uv;gl_Position=vec4(p,0.,1.);}'));
 gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'precision mediump float;varying vec2 t;uniform sampler2D image;void main(){gl_FragColor=texture2D(image,t);}'));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error('无法初始化画布');gl.useProgram(program);
 const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);const pos=gl.getAttribLocation(program,'p'),uv=gl.getAttribLocation(program,'uv');
 gl.enableVertexAttribArray(pos);gl.vertexAttribPointer(pos,2,gl.FLOAT,false,16,0);gl.enableVertexAttribArray(uv);gl.vertexAttribPointer(uv,2,gl.FLOAT,false,16,8);
 const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(triangles),gl.STATIC_DRAW);
 const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,texture);
 const data=new Float32Array(nodes.length*4);
 return ()=>{gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);nodes.forEach((n,i)=>{data[i*4]=(box.x+(n.u+n.x)*box.w)/width*2-1;data[i*4+1]=1-(box.y+(n.v+n.y)*box.h)/height*2;data[i*4+2]=n.u;data[i*4+3]=n.v});gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,data,gl.DYNAMIC_DRAW);gl.drawElements(gl.TRIANGLES,triangles.length,gl.UNSIGNED_SHORT,0)};
 }
 const ctx=canvas.getContext('2d');
 if(!ctx)throw Error('浏览器暂不支持画布');
 return ()=>{ctx.setTransform(canvas.width/width,0,0,canvas.height/height,0,0);ctx.clearRect(0,0,width,height);
 for(let i=0;i<triangles.length;i+=3){const pts=triangles.slice(i,i+3).map(k=>nodes[k]),src=pts.map(p=>[p.u*tw,p.v*th]),dst=pts.map(p=>[box.x+(p.u+p.x)*box.w,box.y+(p.v+p.y)*box.h]);const [a,b,c]=src,[A,B,C]=dst,den=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
 const m1=((B[0]-A[0])*(c[1]-a[1])-(C[0]-A[0])*(b[1]-a[1]))/den,m2=((B[1]-A[1])*(c[1]-a[1])-(C[1]-A[1])*(b[1]-a[1]))/den,m3=((C[0]-A[0])*(b[0]-a[0])-(B[0]-A[0])*(c[0]-a[0]))/den,m4=((C[1]-A[1])*(b[0]-a[0])-(B[1]-A[1])*(c[0]-a[0]))/den;
 ctx.save();ctx.beginPath();const mx=(A[0]+B[0]+C[0])/3,my=(A[1]+B[1]+C[1])/3;dst.forEach((p,j)=>{const dx=p[0]-mx,dy=p[1]-my,l=Math.hypot(dx,dy);ctx[j?'lineTo':'moveTo'](p[0]+dx/l*.35,p[1]+dy/l*.35)});ctx.closePath();ctx.clip();ctx.transform(m1,m2,m3,m4,A[0]-m1*a[0]-m3*a[1],A[1]-m2*a[0]-m4*a[1]);ctx.drawImage(texture,0,0);ctx.restore()}
 };
}
function resize(){width=stage.clientWidth;height=stage.clientHeight;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);const w=Math.min(width*.73,height*.79*tw/th,575),h=w*th/tw;box={x:(width-w)/2,y:height*.49-h/2,w,h};if(ready){release();wake()}}
function physics(dt){
 const f=+slider.value/100,k=70+f*180,damping=reduced?28:6.8+f*4.5;let energy=0;
 for(let i=0;i<nodes.length;i++){const n=nodes[i],col=i%(N+1),row=(i/(N+1))|0;let sx=0,sy=0,count=0;for(const j of [col?i-1:-1,col<N?i+1:-1,row?i-N-1:-1,row<M?i+N+1:-1])if(j>=0){sx+=nodes[j].x-n.x;sy+=nodes[j].y-n.y;count++}
 let tx=0,ty=0;if(pointer){const rx=n.u-pointer.u,ry=(n.v-pointer.v)*th/tw,g=Math.exp(-(rx*rx+ry*ry)/.14),soft=1-f*.4;tx=(pointer.dx-rx*.22)*g*soft;ty=(pointer.dy-(n.v-pointer.v)*.22+.047)*g*soft}
 n.vx+=(-k*(n.x-tx)-damping*n.vx+110*sx)*dt;n.vy+=(-k*(n.y-ty)-damping*n.vy+110*sy)*dt;
 }
 for(const n of nodes){n.x=clamp(n.x+n.vx*dt,-.25,.25);n.y=clamp(n.y+n.vy*dt,-.25,.25);energy+=n.vx*n.vx+n.vy*n.vy+n.x*n.x+n.y*n.y}
 // Bound displacement gradients in both directions to keep every cell orientation positive.
 let grad=0;for(let i=0;i<nodes.length;i++){const n=nodes[i];if(i%(N+1)<N){const b=nodes[i+1];grad=Math.max(grad,Math.abs(n.x-b.x)*N,Math.abs(n.y-b.y)*N)}if(i+N+1<nodes.length){const b=nodes[i+N+1];grad=Math.max(grad,Math.abs(n.x-b.x)*M,Math.abs(n.y-b.y)*M)}}
 if(grad>.38){const s=.38/grad;for(const n of nodes){n.x*=s;n.y*=s;n.vx*=s;n.vy*=s}}
 steps++;return energy/nodes.length;
}
function frame(t){raf=0;acc+=Math.min((t-last)/1000,.04);last=t;let energy=1;while(acc>=1/120){energy=physics(1/120);acc-=1/120}renderer();const center=nodes[(nodes.length/2)|0];shadow.style.transform='translateX('+center.x*box.w*.3+'px) scaleX('+(1+Math.abs(center.x))+')';
 if(!pointer&&energy<.0000005){nodes.forEach(n=>{n.x=n.y=n.vx=n.vy=0});renderer();settled=true;say('软软的，等你再捏一下');return}raf=requestAnimationFrame(frame)}
function wake(){if(!ready||document.hidden)return;settled=false;if(!raf){last=performance.now();acc=0;raf=requestAnimationFrame(frame)}}
function coords(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left-box.x)/box.w,y:(e.clientY-r.top-box.y)/box.h}}
function hit(p){for(let i=0;i<triangles.length;i+=3){const [a,b,c]=triangles.slice(i,i+3).map(k=>nodes[k]);const ax=a.u+a.x,ay=a.v+a.y,bx=b.u+b.x,by=b.v+b.y,cx=c.u+c.x,cy=c.v+c.y,den=(by-cy)*(ax-cx)+(cx-bx)*(ay-cy),wa=((by-cy)*(p.x-cx)+(cx-bx)*(p.y-cy))/den,wb=((cy-ay)*(p.x-cx)+(ax-cx)*(p.y-cy))/den,wc=1-wa-wb;if(wa>=0&&wb>=0&&wc>=0){const u=a.u*wa+b.u*wb+c.u*wc,v=a.v*wa+b.v*wb+c.v*wc;if(alpha[(clamp(Math.floor(v*th),0,th-1)*tw+clamp(Math.floor(u*tw),0,tw-1))*4+3]>80)return {u,v}}}return null}
canvas.addEventListener('pointerdown',e=>{if(!ready||pointer||!e.isPrimary||e.button!==0)return;const p=coords(e),h=hit(p);if(!h)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);pointer={id:e.pointerId,u:h.u,v:h.v,startX:p.x,startY:p.y,dx:0,dy:0};canvas.classList.add('held');pressCount++;gesture++;say('轻轻按住，让酥皮也变柔软');wake()});
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;const p=coords(e);pointer.dx=clamp(p.x-pointer.startX,-.24,.24);pointer.dy=clamp(p.y-pointer.startY,-.24,.24);if(Math.hypot(pointer.dx,pointer.dy)>.025)say('拉长一点点，然后松开…');wake()});
function release(e){if(!pointer||(e&&e.pointerId!==undefined&&e.pointerId!==pointer.id))return;const id=pointer.id;pointer=null;canvas.classList.remove('held');if(canvas.hasPointerCapture(id))canvas.releasePointerCapture(id);say('晃呀晃，慢慢回到原来的样子');wake()}
['pointerup','pointercancel','lostpointercapture'].forEach(type=>canvas.addEventListener(type,release));window.addEventListener('blur',()=>release());document.addEventListener('visibilitychange',()=>{if(document.hidden){release();if(raf)cancelAnimationFrame(raf);raf=0}else wake()});
shake.addEventListener('click',()=>{if(!ready)return;release();const amp=reduced?.24:1;nodes.forEach(n=>{n.vx+=Math.cos(n.v*3.7)*amp;n.vy+=Math.sin(n.u*5)*amp*.48});gesture++;say('叮，你的菠萝包正在晃动');wake()});
reset.addEventListener('click',()=>{release();nodes.forEach(n=>{n.x=n.y=n.vx=n.vy=0});if(raf)cancelAnimationFrame(raf);raf=0;acc=0;settled=true;renderer();shadow.style.transform='';say('恢复原状，又是一只圆圆的菠萝包')});
slider.addEventListener('input',()=>{const v=+slider.value;value.textContent=(v<25?'软糯':v<60?'绵软':'弹韧')+' · '+v+'%';slider.setAttribute('aria-valuetext',value.textContent);wake()});
new ResizeObserver(resize).observe(stage);
